name: E2E Tests

on:
  push:
    branches: [ main, master, 'test-*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android-17:
    name: E2E Android 17 (CMP ${{ matrix.profile }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: ['1.10']

    steps:
      - name: Checkout kmp-mobile repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android 17 SDK & System Image
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=3 "platforms;android-37.0" "system-images;android-37.0;google_apis;arm64-v8a" "emulator" "platform-tools"

      - name: Create and Start Android 17 Emulator
        run: |
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n test_avd -k "system-images;android-37.0;google_apis;arm64-v8a" --force
          $ANDROID_HOME/emulator/emulator -avd test_avd -no-window -no-audio -no-snapshot -gpu swiftshader_indirect &
          $ANDROID_HOME/platform-tools/adb wait-for-device shell 'while [[ "$(getprop sys.boot_completed)" != "1" ]]; do sleep 2; done'
          echo "Emulator booted successfully! Android Version:"
          $ANDROID_HOME/platform-tools/adb shell getprop ro.build.version.release

      - name: Run Android E2E Tests on Android 17
        run: ./gradlew :shared:e2eAndroidTest -PcmpProfile=${{ matrix.profile }} -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload Android E2E Test Results & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-results-cmp-${{ matrix.profile }}
          path: |
            shared/build/reports/
            shared/build/parikshan/
          if-no-files-found: ignore
