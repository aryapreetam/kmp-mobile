name: E2E Tests

on:
  push:
    branches: [ main, master, 'test-*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android-17:
    name: E2E Android 17 (CMP ${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: ['1.10']

    steps:
      - name: Checkout kmp-mobile repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 777 /dev/kvm || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android 17 SDK & System Image
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "system-images;android-37.0;google_apis;x86_64" \
            "emulator" \
            "platform-tools"

      - name: Create and Boot Android 17 Emulator
        run: |
          # Ensure default AVD home exists
          mkdir -p ~/.android/avd

          # Create AVD (no -p flag so avdmanager writes both .ini and .avd/ in default location)
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            -n test_avd \
            -k "system-images;android-37.0;google_apis;x86_64" \
            --force

          # Verify AVD was created
          echo "=== AVD files ==="
          ls -la ~/.android/avd/
          echo "=== AVD list ==="
          $ANDROID_HOME/emulator/emulator -list-avds

          # Boot emulator with KVM
          $ANDROID_HOME/emulator/emulator -avd test_avd \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -camera-back none -gpu swiftshader_indirect -memory 4096 \
            > emulator.log 2>&1 &

          # Wait for boot with progress reporting
          for i in $(seq 1 90); do
            BOOTED=$($ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$BOOTED" = "1" ]; then
              echo "Emulator booted after $((i * 5))s"
              break
            fi
            if [ $((i % 6)) -eq 0 ]; then
              echo "Still waiting... ($((i * 5))s elapsed)"
            fi
            sleep 5
          done

          if [ "$BOOTED" != "1" ]; then
            echo "::error::Emulator failed to boot. Logs:"
            cat emulator.log
            exit 1
          fi

          $ANDROID_HOME/platform-tools/adb shell getprop ro.build.version.release
          $ANDROID_HOME/platform-tools/adb shell getprop ro.build.version.sdk

      - name: Run Android E2E Tests on Android 17
        run: ./gradlew :shared:e2eAndroidTest -PcmpProfile=${{ matrix.profile }} -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload Android E2E Test Results & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-results-cmp-${{ matrix.profile }}
          path: |
            shared/build/reports/
            shared/build/parikshan/
          if-no-files-found: ignore
