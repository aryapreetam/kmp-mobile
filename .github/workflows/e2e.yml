name: E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    name: E2E Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout kmp-mobile repository
        uses: actions/checkout@v4

      # - name: Checkout Parikshan framework repository
      #   uses: actions/checkout@v4
      #   with:
      #     repository: aryapreetam/parikshan
      #     ref: fix/gradle-plugin-target-resolution-issues-12-13
      #     path: parikshan

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # - name: Build & Publish Parikshan to Maven Local
      #   working-directory: parikshan
      #   run: ./gradlew publishToMavenLocal -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Run Android E2E Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :shared:e2eAndroidTest -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload Android E2E Test Results & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-results
          path: |
            shared/build/reports/
            shared/build/parikshan/
          if-no-files-found: ignore

  e2e-ios:
    name: E2E iOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout kmp-mobile repository
        uses: actions/checkout@v4

      # - name: Checkout Parikshan framework repository
      #   uses: actions/checkout@v4
      #   with:
      #     repository: aryapreetam/parikshan
      #     ref: fix/gradle-plugin-target-resolution-issues-12-13
      #     path: parikshan

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # - name: Build & Publish Parikshan to Maven Local
      #   working-directory: parikshan
      #   run: ./gradlew publishToMavenLocal -Dorg.gradle.jvmargs="-Xmx6g"

      - name: Pre-boot Simulator
        run: |
          xcrun simctl list devices
          xcrun simctl boot "iPhone 15" || true

      - name: Pre-compile iOS Native Framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" -Pparikshan.e2e.active=true

      - name: Run iOS E2E Tests
        run: ./gradlew :shared:e2eIosTest -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" -Dparikshan.xcodebuild.timeout=1800

      - name: Upload iOS E2E Test Results & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-results
          path: |
            shared/build/reports/
            shared/build/parikshan/
          if-no-files-found: ignore
