name: E2E Tests

on:
  push:
    branches:
      - main
      - master
      - 'test-*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android-17:
    name: E2E Android 17 (CMP ${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        profile:
          - '1.10'

    steps:
      - name: Checkout kmp-mobile repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Enable KVM
        run: |
          echo "=== KVM ==="
          ls -la /dev/kvm || true

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM is available"
          else
            echo "::warning::/dev/kvm is not available"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android 17 SDK and emulator
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "=== Pre-installed SDK Manager version ==="
          "$SDKMANAGER" --version

          # cmdline-tools < v20.0 cannot handle android-37.0 minor versioning.
          # Update to latest first, using canary channel (--channel=3).
          echo "=== Updating cmdline-tools to latest (v20+) ==="
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3 "cmdline-tools;latest"

          echo "=== Updated SDK Manager version ==="
          "$SDKMANAGER" --version

          echo "=== Android 37 packages available ==="
          "$SDKMANAGER" --channel=3 --list | grep -E \
            'platforms;android-37|system-images;android-37' || true

          echo "=== Install packages ==="
          "$SDKMANAGER" --channel=3 \
            "platform-tools" \
            "emulator" \
            "platforms;android-37.0" \
            "system-images;android-37.0;google_apis;x86_64"

          echo "=== Verify installed ==="
          ls -d $ANDROID_HOME/system-images/android-37*/*/* 2>/dev/null || echo "system-images dir not found"

      - name: Create Android 17 emulator
        shell: bash
        run: |
          set -e

          AVD_NAME="android17"
          AVD_PACKAGE="system-images;android-37.0;google_apis;x86_64"

          mkdir -p "$HOME/.android/avd"

          echo "=== Existing AVDs ==="
          "$ANDROID_HOME/emulator/emulator" -list-avds || true

          echo "=== Creating AVD ==="

          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name "$AVD_NAME" \
            --package "$AVD_PACKAGE" \
            --device "pixel_6" \
            -v 2>&1

          echo "=== Created AVD ==="
          "$ANDROID_HOME/emulator/emulator" -list-avds

          echo "=== AVD configuration ==="
          cat "$HOME/.android/avd/${AVD_NAME}.avd/config.ini"

      - name: Boot Android 17 emulator
        shell: bash
        run: |
          set -e

          AVD_NAME="android17"
          EMULATOR="$ANDROID_HOME/emulator/emulator"

          echo "=== Emulator version ==="
          "$EMULATOR" -version

          echo "=== KVM ==="
          ls -la /dev/kvm || true

          echo "=== Starting emulator ==="

          nohup "$EMULATOR" \
            -avd "$AVD_NAME" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -camera-back none \
            -gpu swiftshader \
            -cores 2 \
            -memory 2048 \
            > emulator.log 2>&1 &

          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > emulator.pid

          echo "Emulator PID: $EMULATOR_PID"

          echo "=== Waiting for ADB device ==="

          "$ANDROID_HOME/platform-tools/adb" start-server

          timeout 120 \
            "$ANDROID_HOME/platform-tools/adb" wait-for-device

          echo "ADB device detected."

          echo "=== Waiting for Android boot ==="

          timeout 300 bash -c '
            while true; do
              BOOT_COMPLETED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")

              if [ "$BOOT_COMPLETED" = "1" ]; then
                echo "Android boot completed."
                break
              fi

              echo "Waiting for Android boot..."
              sleep 5
            done
          '

          echo "=== Disable animations ==="

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          echo "=== Android information ==="

          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.cpu.abi

          echo "=== Connected devices ==="

          adb devices -l

          echo "=== Emulator ready ==="

      - name: Run Android E2E Tests on Android 17
        run: |
          ./gradlew \
            :shared:e2eAndroidTest \
            -PcmpProfile=${{ matrix.profile }} \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Dump emulator diagnostics
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "ADB DEVICES"
          echo "========================================"
          adb devices -l || true

          echo "========================================"
          echo "EMULATOR PROCESS"
          echo "========================================"
          ps aux | grep '[e]mulator' || true

          echo "========================================"
          echo "EMULATOR LOG"
          echo "========================================"
          if [ -f emulator.log ]; then
            cat emulator.log
          else
            echo "emulator.log does not exist"
          fi

          echo "========================================"
          echo "ADB LOGCAT"
          echo "========================================"
          adb logcat -d -t 500 || true

      - name: Upload Android E2E Test Results & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-results-cmp-${{ matrix.profile }}
          path: |
            shared/build/reports/
            shared/build/parikshan/
            emulator.log
          if-no-files-found: ignore
