name: E2E Tests

on:
  push:
    branches: [ main, master, 'test-*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android-17:
    name: E2E Android 17 (CMP ${{ matrix.profile }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: ['1.10']

    steps:
      - name: Checkout kmp-mobile repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android 17 SDK & System Image
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=3 "platforms;android-37.0" "system-images;android-37.0;google_apis;arm64-v8a" "emulator" "platform-tools"

      - name: Create and Start Android 17 Emulator
        run: |
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n test_avd -k "system-images;android-37.0;google_apis;arm64-v8a" --force
          echo "hw.ramSize=4096" >> ~/.android/avd/test_avd.avd/config.ini
          echo "disk.dataPartition.size=4096M" >> ~/.android/avd/test_avd.avd/config.ini
          echo "vm.heapSize=576" >> ~/.android/avd/test_avd.avd/config.ini
          
          echo "Starting Android 17 emulator in background..."
          $ANDROID_HOME/emulator/emulator -avd test_avd -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -gpu swiftshader_indirect > emulator.log 2>&1 &
          
          echo "Waiting for emulator to boot..."
          for i in {1..60}; do
            BOOTED=$($ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$BOOTED" = "1" ]; then
              echo "Emulator booted successfully after $((i * 5)) seconds!"
              break
            fi
            echo "Waiting for boot... ($((i * 5))s elapsed)"
            sleep 5
          done

          if [ "$BOOTED" != "1" ]; then
            echo "Emulator failed to boot in time. Emulator logs:"
            cat emulator.log
            exit 1
          fi

          echo "Android Version: $($ANDROID_HOME/platform-tools/adb shell getprop ro.build.version.release)"

      - name: Run Android E2E Tests on Android 17
        run: ./gradlew :shared:e2eAndroidTest -PcmpProfile=${{ matrix.profile }} -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload Android E2E Test Results & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-results-cmp-${{ matrix.profile }}
          path: |
            shared/build/reports/
            shared/build/parikshan/
          if-no-files-found: ignore
