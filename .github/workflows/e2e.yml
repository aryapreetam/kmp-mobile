name: E2E Tests

on:
  push:
    branches: [ main, master, 'test-*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android-17:
    name: E2E Android 17 (CMP ${{ matrix.profile }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: ['1.10']

    steps:
      - name: Checkout kmp-mobile repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android E2E Tests on Android 17 Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: arm64-v8a
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :shared:e2eAndroidTest -PcmpProfile=${{ matrix.profile }} -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload Android E2E Test Results & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-results-cmp-${{ matrix.profile }}
          path: |
            shared/build/reports/
            shared/build/parikshan/
          if-no-files-found: ignore

